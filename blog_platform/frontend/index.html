<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="brand">
                BLOGSPACE
            </div>

            <div class="login-intro">

                <p class="small-text">
                    WELCOME BACK
                </p>

                <h1>
                    Stories worth
                    <span>sharing.</span>
                </h1>

                <p>
                    Sign in to continue reading, writing
                    and sharing your stories with the community.
                </p>

            </div>

            <div class="quote">
                "Every story deserves to be heard."
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-form-container">

                <div class="mobile-brand">
                    BLOGSPACE
                </div>

                <h2>
                    Sign in
                </h2>

                <p class="login-subtitle">
                    Enter your details to access your account.
                </p>


                <form id="loginForm">

                    <!-- USERNAME -->
                    <div class="input-group">

                        <label for="loginUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="loginUsername"
                            placeholder="Your username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Your password"
                            required
                        >

                    </div>


                    <!-- ROLE -->
                    <div class="input-group">

                        <label for="loginRole">
                            Account type
                        </label>

                        <select id="loginRole" required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="Guest">
                                Guest
                            </option>

                            <option value="Blogger">
                                Blogger
                            </option>

                            <option value="ADMIN">
                                Admin
                            </option>

                        </select>

                    </div>


                    <!-- LOGIN BUTTON -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        <span>Sign in</span>
                        <span class="arrow">→</span>
                    </button>


                    <!-- MESSAGE -->
                    <p
                        id="loginMessage"
                        class="message"
                    ></p>

                </form>


                <!-- REGISTER LINK -->
                <div class="register-link">

                    <span>
                        New to BlogSpace?
                    </span>

                    <a href="register.html">
                        Create an account
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
