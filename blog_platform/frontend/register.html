<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace - Register</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="register-page">


        <!-- LEFT SIDE -->
        <div class="register-content">

            <div class="brand">
                BLOGSPACE
            </div>


            <div class="register-intro">

                <p class="small-text">
                    JOIN THE COMMUNITY
                </p>

                <h1>
                    Your voice
                    <span>matters.</span>
                </h1>

                <p>
                    Create an account and become part of a
                    community where ideas, stories and
                    experiences come together.
                </p>

            </div>


            <div class="register-note">

                <div class="note-number">
                    01
                </div>

                <p>
                    Create your account.
                </p>

            </div>

        </div>



        <!-- RIGHT SIDE -->
        <div class="register-form-side">

            <div class="register-form-container">


                <h2>
                    Create account
                </h2>

                <p class="register-subtitle">
                    Fill in your details to get started.
                </p>


                <form id="registerForm">


                    <!-- USERNAME -->
                    <div class="input-group">

                        <label for="registerUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            id="registerUsername"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- ROLE -->
                    <div class="input-group">

                        <label for="registerRole">
                            I want to join as
                        </label>

                        <select
                            id="registerRole"
                            required
                        >

                            <option value="">
                                Select account type
                            </option>

                            <option value="Guest">
                                Guest
                            </option>

                            <option value="Blogger">
                                Blogger
                            </option>

                        </select>

                    </div>


                    <!-- REGISTER BUTTON -->
                    <button
                        type="submit"
                        class="register-button"
                    >
                        Create account
                        <span>→</span>
                    </button>


                    <!-- MESSAGE -->
                    <p
                        id="registerMessage"
                        class="message"
                    ></p>

                </form>


                <!-- LOGIN LINK -->
                <div class="login-link">

                    <span>
                        Already have an account?
                    </span>

                    <a href="index.html">
                        Sign in
                    </a>

                </div>


            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
